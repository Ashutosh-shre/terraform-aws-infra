name: infra deployment
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TF_VERSION: "~> 1.13.0"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

permissions:
  contents: read
  id-token: write
defaults:
  run:
    working-directory: ./project-code
  
jobs:
  code-check-and-plan:
    if : github.event_name == 'pull_request'
    name: terraform fmt, init, validate and plan
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: aws-configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN}}
          aws-region: ${{ vars.AWS_REGION }}
      - name: seting up terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: create terraform plugin cache directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: terraform cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt
      - name: upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan.txt  
  code-apply:
    if : github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: terraform apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: aws-configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: seting up terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: create terraform plugin cache directory
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: terraform cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      

      
        

      
           

